name: Build Native Android APK
on:
  push:
  workflow_dispatch:

env:
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.29.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate pyproject.toml & Compile Native APK
        run: |
          rm -f requirements.txt
          cat << 'EOF' > pyproject.toml
          [project]
          name = "sivanantha_erp_pro"
          version = "1.0.0"
          description = "Sivanantha Export Fabs - Textile ERP & GST Suite"
          requires-python = ">=3.11"
          dependencies = [
              "flet==0.28.3",
              "certifi",
          ]

          [tool.flet]
          org = "com.sivanantha.erp"
          product = "Sivanantha ERP"
          company = "Sivanantha Export Fabs"

          [tool.flet.android]
          split_per_abi = false

          [tool.flet.flutter.pubspec.dependency_overrides]
          webview_flutter_android = "4.10.1"
          EOF

          pip install --upgrade pip
          pip install "flet[all]==0.28.3" certifi
          flet build apk --yes -v

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Sivanantha_ERP_Pro_APK
          path: build/apk/*.apk
