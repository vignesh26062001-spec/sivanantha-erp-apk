name: Build Native Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compile Standalone Native APK
        run: |
          pip install flet==0.24.1
          flet build apk --project "sivanantha_erp_pro" --product "Sivanantha ERP" --org "com.sivanantha.erp" -vv

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Sivanantha_ERP_Pro_APK
          path: build/apk/*.apk
